<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Building project payments">
  <title>Manzel - Project</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <!-- Header Row: Back + Language -->
    <div class="header-row">
      <button class="back-btn" id="backBtn">
        <span>←</span>
        <span data-i18n="back">חזרה</span>
      </button>
      <div class="lang-switcher" id="langSwitcher">
        <button class="lang-switcher__btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
          <span id="langCode">HE</span>
          <svg class="lang-switcher__arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <ul class="lang-switcher__menu" id="langMenu" role="listbox">
          <li role="option" data-lang="he">עברית</li>
          <li role="option" data-lang="en">English</li>
          <li role="option" data-lang="ar">العربية</li>
          <li role="option" data-lang="ru">Русский</li>
          <li role="option" data-lang="uk">Українська</li>
        </ul>
      </div>
    </div>

    <!-- Project Summary -->
    <section class="project-hero" id="projectHero">
      <div class="skeleton-group" id="projectLoading">
        <div class="skeleton skeleton--name"></div>
        <div class="skeleton skeleton--total"></div>
      </div>
      <div class="hidden" id="projectContent">
        <div class="project-hero__top">
          <h1 class="project-hero__name" id="projectName" dir="auto"></h1>
          <span class="project-hero__due" id="projectDue"></span>
        </div>
        <p class="project-hero__description hidden" id="projectDescription" dir="auto"></p>
        <p class="project-hero__amount" id="projectCollected"></p>
        <div class="progress" id="projectProgress">
          <div class="progress__fill progress__fill--success" id="projectProgressFill"></div>
        </div>
        <div class="project-hero__meta">
          <span id="projectPaidOf"></span>
          <span id="projectPerApartment"></span>
        </div>
        <p class="project-hero__cost" id="projectTotalCost"></p>
        <a href="payment.html" class="pay-btn" data-i18n="payNow">לתשלום</a>
      </div>
    </section>

    <!-- Apartments -->
    <section class="project-apartments-section hidden" id="apartmentsSection">
      <h2 class="section-title" data-i18n="building">הבניין</h2>
      <ul class="project-apartments" id="projectApartments">
        <!-- Apartments will be rendered here by JavaScript -->
      </ul>
    </section>

    <!-- Not Found -->
    <div class="not-found hidden" id="notFound">
      <p data-i18n="projectNotFound">הפרויקט לא נמצא</p>
      <a href="index.html" class="pay-btn" data-i18n="backHome">חזרה לדף הראשי</a>
    </div>
  </main>

  <footer class="footer">
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/api.js"></script>
  <script src="js/project.js"></script>
  <script>
    (function(){var t=localStorage.getItem('manzel_theme');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);})();
  </script>
</body>
</html>
